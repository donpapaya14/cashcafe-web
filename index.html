<style>
  :root {
    --bg: #1a0d05;
    --surface-1: rgba(28, 16, 8, 0.72);
    --surface-2: rgba(42, 24, 12, 0.68);
    --line: rgba(255, 248, 238, 0.18);
    --line-strong: rgba(255, 248, 238, 0.38);
    --ink-1: #fff8ee;
    --ink-2: rgba(255, 248, 238, 0.82);
    --ink-3: rgba(255, 248, 238, 0.62);
    --accent: #E84A1F;                       /* Cash Café orange — default */
    --accent-soft: oklch(0.72 0.16 38);
    --accent-on: #ffffff;
    --brand: #E84A1F;
    --brand-cream: #efe8cc;
    --brand-tan: #b48562;
    --ok: oklch(0.58 0.10 145);
    --shadow-soft: rgba(60, 40, 26, 0.06);
    --shadow-strong: rgba(60, 40, 26, 0.22);
    --espresso: #1d1812;
  }
  /* accent variants */
  .accent-brass     { --accent: oklch(0.66 0.12 78);  --accent-soft: oklch(0.93 0.05 78); }
  .accent-terracotta{ --accent: oklch(0.58 0.13 38);  --accent-soft: oklch(0.92 0.05 38); }
  .accent-forest    { --accent: oklch(0.46 0.08 150); --accent-soft: oklch(0.90 0.04 150); }
  .accent-orange    { --accent: #E84A1F;              --accent-soft: oklch(0.93 0.06 38); }

  /* brand mark */
  .brand-mark {
    display: inline-grid; place-items: center;
    width: 40px; height: 40px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--brand-cream);
    box-shadow: 0 0 0 0.5px rgba(0,0,0,0.10), 0 6px 14px -8px rgba(60,30,14,0.35);
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* ── full-page dynamic video background ─────────────────────────────── */
  .site-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .site-bg video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(1.05) brightness(0.92);
  }
  .site-bg::before {
    /* dark veil so white text stays readable on the video */
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 30%,
        rgba(20, 10, 4, 0.45) 0%,
        rgba(20, 10, 4, 0.65) 50%,
        rgba(20, 10, 4, 0.78) 100%),
      linear-gradient(180deg,
        rgba(30, 16, 6, 0.55) 0%,
        rgba(20, 10, 4, 0.78) 100%);
  }
  .site-bg::after {
    content: "";
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0 0.16  0 0 0 0.45 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.06;
    mix-blend-mode: multiply;
  }
  /* mask the bottom-right corner of the bg video (hides any baked-in watermark) */
  .site-bg-mask {
    position: absolute;
    right: 0; bottom: 0;
    width: 520px; height: 240px;
    pointer-events: none;
    background:
      radial-gradient(ellipse 100% 100% at 100% 100%,
        rgba(15, 8, 3, 0.95) 0%,
        rgba(15, 8, 3, 0.85) 30%,
        rgba(15, 8, 3, 0.5) 60%,
        transparent 100%);
    z-index: 1;
  }
  body {
    background: transparent;
    color: var(--ink-1);
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; }
  img { max-width: 100%; display: block; }
  button { font-family: inherit; }

  .container {
    max-width: 1240px;
    padding: 0 28px;
    margin: 0 auto;
  }

  /* ── typography ─────────────────────────────────────────────────────────── */
  .display {
    font-family: 'Fraunces', ui-serif, Georgia, serif;
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 50;
    font-size: clamp(46px, 6.6vw, 88px);
    line-height: 0.96;
    letter-spacing: -0.02em;
    margin: 14px 0 0;
    color: var(--ink-1);
    text-wrap: pretty;
  }
  .section-title {
    font-family: 'Fraunces', ui-serif, Georgia, serif;
    font-weight: 400;
    font-variation-settings: "opsz" 96;
    font-size: clamp(30px, 3.6vw, 46px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 6px 0 0;
    color: var(--ink-1);
    text-shadow: 0 2px 4px rgba(0,0,0,0.5), 0 6px 24px rgba(0,0,0,0.45);
  }
  .section-title-dark { color: #f3ece1; }
  .lede {
    color: var(--ink-2);
    font-size: 17px;
    line-height: 1.55;
    margin: 0;
    font-weight: 500;
    text-wrap: pretty;
    text-shadow: 0 1px 3px rgba(0,0,0,0.45);
  }
  .lede-dark { color: rgba(243, 236, 225, 0.78); }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-1);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .eyebrow::before {
    content: "";
    width: 18px; height: 1px;
    background: var(--ink-3);
    display: inline-block;
  }
  .eyebrow-on-dark { color: rgba(243, 236, 225, 0.55); }
  .eyebrow-on-dark::before { background: rgba(243, 236, 225, 0.4); }
  .micro {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .results { font-size: 13px; color: var(--ink-3); }
  .section-head { margin-bottom: 4px; }

  /* ── dynamic coffee background ────────────────────────────────────────── */
  .coffee-bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .coffee-bg::before {
    content: "";
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(ellipse 60% 50% at 18% 28%,
        color-mix(in oklab, var(--accent) 22%, transparent), transparent 60%),
      radial-gradient(ellipse 55% 45% at 82% 72%,
        color-mix(in oklab, var(--accent) 14%, transparent), transparent 65%),
      radial-gradient(ellipse 80% 60% at 50% 110%,
        color-mix(in oklab, #4a2a14 18%, transparent), transparent 70%);
    animation: coffeeBreathe 18s ease-in-out infinite;
    filter: blur(2px);
    opacity: 0.85;
  }
  .coffee-bg::after {
    content: "";
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0 0.10  0 0 0 0.4 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.07;
    mix-blend-mode: multiply;
  }
  @keyframes coffeeBreathe {
    0%, 100% { transform: translate3d(0,0,0) scale(1); opacity: .85; }
    50%      { transform: translate3d(2%,-1%,0) scale(1.06); opacity: 1; }
  }

  .steam {
    position: absolute;
    bottom: -40px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%,
      rgba(255,250,242,0.55), rgba(255,250,242,0) 65%);
    filter: blur(20px);
    opacity: 0;
    animation: steamRise 14s ease-in infinite;
  }
  .steam.s1 { left: 6%; }
  .steam.s2 { left: 22%; width: 110px; height: 110px; animation-delay: 3s; animation-duration: 17s; }
  .steam.s3 { left: 48%; width: 160px; height: 160px; animation-delay: 6s; animation-duration: 19s; }
  .steam.s4 { left: 72%; width: 120px; height: 120px; animation-delay: 1s; animation-duration: 15s; }
  .steam.s5 { left: 88%; width: 100px; height: 100px; animation-delay: 8s; animation-duration: 21s; }
  @keyframes steamRise {
    0%   { transform: translate3d(0, 0, 0) scale(0.6); opacity: 0; }
    15%  { opacity: 0.55; }
    50%  { transform: translate3d(20px, -55vh, 0) scale(1.2); opacity: 0.4; }
    100% { transform: translate3d(-10px, -110vh, 0) scale(1.8); opacity: 0; }
  }

  .bean {
    position: absolute;
    width: 22px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 30% 30%, #5a3318, #2c1808 70%);
    box-shadow: inset 0 0 0 0.5px rgba(255,240,220,0.08);
    opacity: 0;
    animation: beanDrift 22s linear infinite;
  }
  .bean::before {
    content: "";
    position: absolute; inset: 1px;
    border-radius: 50%;
    background: linear-gradient(90deg, transparent 47%, rgba(255,235,210,0.18) 49%, rgba(255,235,210,0.18) 51%, transparent 53%);
  }
  .bean.b1 { top: 18%; left: -5%;  animation-delay:  0s; }
  .bean.b2 { top: 62%; left: -5%;  animation-delay:  6s; animation-duration: 26s; }
  .bean.b3 { top: 35%; left: -5%;  animation-delay: 11s; animation-duration: 30s; }
  .bean.b4 { top: 80%; left: -5%;  animation-delay: 16s; animation-duration: 24s; }
  .bean.b5 { top: 8%;  left: -5%;  animation-delay: 19s; animation-duration: 28s; }
  @keyframes beanDrift {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.32; }
    50%  { opacity: 0.32; }
    100% { transform: translate3d(110vw, -80px, 0) rotate(540deg); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .coffee-bg::before { animation: none; }
    .steam, .bean { animation: none; opacity: 0; }
  }

  /* ── moka scene (real video, full-bleed) ─────────────────────────────── */
  .moka-scene {
    position: relative;
    width: 100%;
    aspect-ratio: 5 / 6;
    max-width: 480px;
    margin-left: auto;
  }
  .moka-frame {
    position: absolute; inset: 0;
    border-radius: 14px;
    overflow: hidden;
    background: #0d0905;
    box-shadow:
      0 0 0 0.5px rgba(0,0,0,0.10),
      0 30px 60px -28px rgba(40,18,8,0.55),
      0 12px 22px -16px rgba(40,18,8,0.45);
  }
  .moka-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    filter: contrast(1.04) saturate(1.05);
  }
  .moka-vignette {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 95% 65% at 50% 35%,
        transparent 0%, transparent 55%, rgba(0,0,0,0.35) 100%),
      linear-gradient(180deg, rgba(232,74,31,0.06) 0%, transparent 35%, rgba(0,0,0,0.25) 100%);
    pointer-events: none;
  }
  .moka-grain {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0.4 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.12;
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  /* logo medallion floating on top-left of video */
  .moka-medallion {
    position: absolute;
    left: 18px; top: 18px;
    width: 64px; height: 64px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--brand-cream);
    box-shadow:
      0 0 0 2px rgba(255,255,255,0.85),
      0 12px 28px -10px rgba(0,0,0,0.55);
    z-index: 4;
    animation: medallionFloat 6s ease-in-out infinite;
  }
  .moka-medallion img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  @keyframes medallionFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-4px) rotate(2deg); }
  }

  /* extra steam wisps over the video */
  .moka-steam-wrap {
    position: absolute;
    left: 25%; top: 30%;
    width: 50%; height: 50%;
    pointer-events: none;
    z-index: 3;
  }
  .moka-steam {
    position: absolute;
    bottom: 0;
    left: 30%;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%,
      rgba(255,250,242,0.55), rgba(255,250,242,0) 65%);
    filter: blur(10px);
    opacity: 0;
    animation: mokaSteam 5s ease-in infinite;
    mix-blend-mode: screen;
  }
  .moka-steam.ms1 { left: 20%; width: 70px; height: 70px; animation-delay: 0s; }
  .moka-steam.ms2 { left: 40%; width: 90px; height: 90px; animation-delay: 1s; animation-duration: 5.5s; }
  .moka-steam.ms3 { left: 30%; width: 100px; height: 100px; animation-delay: 2s; animation-duration: 6s; }
  .moka-steam.ms4 { left: 50%; width: 75px; height: 75px; animation-delay: 3s; animation-duration: 4.5s; }
  .moka-steam.ms5 { left: 25%; width: 85px; height: 85px; animation-delay: 4s; animation-duration: 5s; }
  @keyframes mokaSteam {
    0%   { transform: translate3d(0, 30px, 0) scale(0.5); opacity: 0; }
    20%  { opacity: 0.7; }
    50%  { transform: translate3d(-12px, -140px, 0) scale(1.2); opacity: 0.45; }
    100% { transform: translate3d(18px, -300px, 0) scale(2); opacity: 0; }
  }

  /* CTA pill */
  .moka-cta {
    position: absolute;
    right: 16px; bottom: 60px;
    padding: 11px 16px; border-radius: 999px;
    border: 0.5px solid rgba(255,255,255,0.2);
    background: rgba(20,14,10,0.65);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    color: #fff;
    font-family: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 9px;
    box-shadow: 0 14px 30px -14px rgba(0,0,0,0.6);
    z-index: 4;
    transition: transform .2s ease, background .2s ease;
  }
  .moka-cta:hover {
    transform: translateY(-1px);
    background: rgba(20,14,10,0.78);
  }
  .moka-cta-dot {
    width: 7px; height: 7px; border-radius: 999px;
    background: var(--brand);
    box-shadow: 0 0 12px rgba(232,74,31,0.7);
    animation: ctaDot 1.6s ease-in-out infinite;
  }
  @keyframes ctaDot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.5); opacity: 0.6; }
  }

  /* editorial caption */
  .moka-caption {
    position: absolute;
    left: 16px; bottom: 16px;
    display: flex; align-items: baseline; gap: 10px;
    font-family: ui-monospace, monospace;
    font-size: 10.5px;
    color: rgba(255,235,215,0.85);
    letter-spacing: 0.1em;
    z-index: 4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .moka-caption-num {
    color: var(--brand);
    font-weight: 700; font-size: 13px;
    text-shadow: 0 0 12px rgba(232,74,31,0.6);
  }

  @media (prefers-reduced-motion: reduce) {
    .moka-medallion, .moka-steam, .moka-cta-dot { animation: none; }
  }

  /* ── hero ───────────────────────────────────────────────────────────────── */
  .hero-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 40px;
    align-items: center;
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 0 80px;
  }
  .hero-text { max-width: 760px; }

  /* Hero text — extra punch for readability over video */
  .hero-text .display {
    text-shadow:
      0 2px 4px rgba(0, 0, 0, 0.55),
      0 6px 30px rgba(0, 0, 0, 0.6),
      0 0 60px rgba(40, 20, 8, 0.4);
  }
  .hero-text .lede {
    font-size: 18px;
    font-weight: 500;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55), 0 4px 20px rgba(0, 0, 0, 0.45);
  }
  .hero-text .eyebrow {
    font-weight: 700;
    letter-spacing: 0.18em;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);

  /* ── nav ────────────────────────────────────────────────────────────────── */
  .topnav-links a:hover { color: var(--ink-1); }

  /* ── mobile nav ─────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {

    .container { padding-left: 16px !important; padding-right: 16px !important; }
    .display { font-size: clamp(28px, 7vw, 48px) !important; }
    .lede { font-size: 14px !important; }
    .section-title { font-size: clamp(22px, 5.5vw, 36px) !important; }
    .eyebrow { font-size: 10px !important; }

    .cafe-body { padding: 12px !important; }
    .cafe-name { font-size: 16px !important; }
    .cafe-specialty { font-size: 12px !important; }
    .cafe-quote { font-size: 12px !important; padding: 10px 12px !important; }
  }
  @media (max-width: 420px) {
    .featured-card { border-radius: 10px !important; }
    .cafe-card { border-radius: 10px !important; }
    .affiliate-card { border-radius: 10px !important; }

  /* ── chips ──────────────────────────────────────────────────────────────── */
  .chip {
    font-size: 12.5px; font-weight: 500;
    padding: 7px 14px; border-radius: 999px;
    border: 0.5px solid var(--line); background: transparent;
    color: var(--ink-2); cursor: pointer;
    transition: all 0.15s ease;
  }
  .chip:hover { border-color: var(--line-strong); color: var(--ink-1); }
  .chip-on {
    background: var(--ink-1); color: var(--bg);
    border-color: var(--ink-1);
  }

  /* ── glass surfaces — apply backdrop blur to anything sitting over the bg video */
  .featured-card,
  .cafe-card,
  .affiliate-card,
  .ad-slot,
  .chill-player,
  .featured-signature,
  .cafe-quote,
  .ad-skeleton {
    backdrop-filter: blur(14px) saturate(120%);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
  }

  /* ── featured ───────────────────────────────────────────────────────────── */
  .featured-card {
    margin-top: 32px;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 0;
    background: var(--surface-1);
    border: 0.5px solid var(--line);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 30px 80px -50px var(--shadow-strong);
    position: relative;
  }
  .featured-card::before {
    content: "";
    position: absolute;
    top: 18px; right: 18px;
    width: 64px; height: 64px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-on);
    display: grid;
    place-items: center;
    z-index: 2;
    box-shadow: 0 10px 30px -15px var(--shadow-strong);
  }
  .featured-card::after {
    content: "★ Pick";
    position: absolute;
    top: 18px; right: 18px;
    width: 64px; height: 64px;
    display: grid;
    place-items: center;
    color: var(--accent-on);
    font-family: 'Fraunces', serif;
    font-size: 13px;
    font-style: italic;
    z-index: 3;
    pointer-events: none;
  }
  .featured-media {
    position: relative;
    min-height: 460px;
  }
  .featured-media > :first-child {
    position: absolute; inset: 0;
  }
  .featured-map {
    position: absolute;
    left: 18px; bottom: 18px;
    width: 58%;
    height: 38%;
    border-radius: 12px;
    overflow: hidden;
    border: 0.5px solid var(--line);
    box-shadow: 0 18px 40px -20px var(--shadow-strong);
    background: var(--surface-2);
  }
  .featured-body {
    padding: 36px 38px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .featured-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 38px;
    line-height: 1.05;
    letter-spacing: -0.015em;
    margin: 4px 0 0;
  }
  .featured-rating {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--ink-2);
    flex-wrap: wrap;
  }
  .featured-desc {
    font-size: 15px;
    color: var(--ink-2);
    line-height: 1.6;
    margin: 4px 0 0;
    text-wrap: pretty;
  }
  .featured-signature {
    margin-top: 12px;
    padding: 14px 16px;
    background: var(--surface-2);
    border-radius: 12px;
  }
  .featured-signature ul {
    margin: 6px 0 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 4px;
  }
  .featured-signature li {
    font-size: 13.5px; color: var(--ink-1);
    display: flex; gap: 8px;
  }
  .featured-signature li span {
    color: var(--accent); font-weight: 700;
  }
  .featured-hours {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px 18px;
    margin-top: 8px;
    padding-top: 14px;
    border-top: 0.5px solid var(--line);
  }
  .featured-hours-row {
    display: flex; flex-direction: column;
    font-size: 12px;
  }
  .featured-hours-row span:first-child {
    color: var(--ink-3);
    font-family: ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .featured-hours-row span:last-child {
    color: var(--ink-1);
    font-variant-numeric: tabular-nums;
  }
  .featured-actions {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 0.5px solid var(--line);
    align-items: center;
  }
  .featured-source {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 5px;
    font-family: ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .btn-primary, .btn-ghost {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 10px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    border: 0.5px solid var(--line);
    transition: all 0.15s ease;
  }
  .btn-primary {
    background: var(--accent); color: var(--accent-on);
    border-color: var(--accent);
  }
  .btn-primary:hover { filter: brightness(0.95); }
  .btn-ghost {
    background: var(--surface-1); color: var(--ink-1);
  }
  .btn-ghost:hover { background: var(--surface-2); }
  @media (max-width: 880px) {
    .featured-card { grid-template-columns: 1fr; }
    .featured-media { min-height: 380px; }
    .featured-body { padding: 28px 24px; }
    .featured-name { font-size: 30px; }
    .featured-hours { grid-template-columns: 1fr 1fr; }
  }

  /* ── directory grid ─────────────────────────────────────────────────────── */
  .directory-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px 24px;
  }
  .directory-grid.compact { gap: 22px 18px; }
  @media (max-width: 980px) { .directory-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .directory-grid { grid-template-columns: 1fr; } }
  @media (max-width: 768px) { .yt-section-grid { grid-template-columns: 1fr !important; } }

  .cafe-card {
    display: flex;
    flex-direction: column;
    gap: 14px;
    cursor: pointer;
    transition: transform 0.25s ease;
    background: var(--surface-1);
    border: 0.5px solid var(--line);
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 14px 40px -28px rgba(0,0,0,0.7);
  }
  .cafe-card:hover { transform: translateY(-2px); }
  .cafe-card:hover .cafe-name { color: var(--accent); }
  .cafe-photo {
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    border: 0.5px solid var(--line);
  }
  .cafe-rating-badge {
    position: absolute;
    bottom: 10px; left: 10px;
    background: rgba(20, 10, 4, 0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 0.5px solid rgba(255, 248, 238, 0.25);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    display: inline-flex; align-items: center; gap: 6px;
    color: #fff8ee;
  }
  .cafe-body { display: flex; flex-direction: column; gap: 6px; }
  .cafe-loc {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px;

    font-family: ui-monospace, monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .cafe-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 22px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 2px 0;
    transition: color 0.15s ease;
  }
  .cafe-tags {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-top: 4px;
  }

  .cafe-specialty {
    display: flex; flex-direction: column; gap: 2px;
    margin-top: 2px;
  }
  .cafe-specialty-label {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }
  .cafe-specialty-text {
    font-size: 13.5px; color: var(--ink-1);
    line-height: 1.45;
    text-wrap: pretty;
  }
  .cafe-quote {
    margin: 6px 0 0;
    padding: 10px 12px 10px 14px;
    border-left: 2px solid var(--accent);
    background: var(--surface-1);
    border-radius: 0 8px 8px 0;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--ink-2);
    text-wrap: pretty;
  }
  .cafe-quote cite {
    display: block;
    margin-top: 6px;
    font-family: ui-monospace, monospace;
    font-style: normal;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* ── España section ──────────────────────────────────────────────────────── */
  .spain-section {
    padding: 64px 0 72px;
    background: transparent;
    border-top: 0.5px solid rgba(255, 248, 238, 0.18);
    border-bottom: 0.5px solid rgba(255, 248, 238, 0.18);
    position: relative;
    overflow: hidden;
  }
  .spain-section::before {
    content: "ES";
    position: absolute;
    right: -20px; top: -40px;
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: clamp(180px, 22vw, 320px);
    letter-spacing: -0.04em;
    color: #fff8ee;
    opacity: 0.10;
    pointer-events: none;
    line-height: 1;
  }
  /* Spain section reads on top of the video — extra shadow for big numerals */
  .spain-section .spain-count-num {
    text-shadow: 0 2px 4px rgba(0,0,0,0.55), 0 6px 24px rgba(0,0,0,0.45);
  }
  .spain-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 24px;
    position: relative;
  }
  .spain-count {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    padding-left: 24px;
    border-left: 0.5px solid rgba(255, 248, 238, 0.3);
  }
  .spain-count-num {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 56px;
    letter-spacing: -0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .spain-count-lbl {
    font-family: ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  @media (max-width: 600px) {
    .spain-count { padding-left: 0; border-left: none; align-items: flex-start; }
  }

  /* ── ad slot ────────────────────────────────────────────────────────────── */
  .ad-slot {
    position: relative;
    border-radius: 14px;
    background: var(--surface-1);
    border: 0.5px solid var(--line);
    overflow: hidden;
    isolation: isolate;
  }
  .ad-disclosure {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 0.5px solid var(--line);
    background: color-mix(in oklab, var(--surface-2) 70%, transparent);
  }
  .ad-disclosure-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.18em;
    font-weight: 600;
    color: var(--ink-2);
    padding: 2px 7px;
    border: 0.5px solid var(--line-strong);
    border-radius: 3px;
    background: var(--bg);
  }
  .ad-disclosure-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    text-transform: uppercase;
  }
  .ad-canvas {
    position: relative;
    background:
      repeating-linear-gradient(135deg,
        transparent 0 10px,
        color-mix(in oklab, var(--surface-2) 60%, transparent) 10px 11px);
    display: grid;
    place-items: center;
  }
  .ad-canvas-marks {
    position: absolute; inset: 8px;
    pointer-events: none;
  }
  .ad-corner {
    position: absolute; width: 10px; height: 10px;
    border-color: var(--ink-3);
    opacity: 0.45;
  }
  .ad-corner-tl { top: 0; left: 0; border-top: 1px solid; border-left: 1px solid; }
  .ad-corner-tr { top: 0; right: 0; border-top: 1px solid; border-right: 1px solid; }
  .ad-corner-bl { bottom: 0; left: 0; border-bottom: 1px solid; border-left: 1px solid; }
  .ad-corner-br { bottom: 0; right: 0; border-bottom: 1px solid; border-right: 1px solid; }
  .ad-canvas-inner {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 14px 24px;
    background: var(--bg);
    border: 0.5px solid var(--line);
    border-radius: 8px;
  }
  .ad-canvas-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .ad-canvas-size {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-1);
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .ad-leaderboard .ad-canvas { min-height: 96px; }
  .ad-skinny .ad-canvas { min-height: 64px; }
  .ad-skinny .ad-canvas-inner { padding: 8px 16px; }
  .ad-square .ad-canvas { min-height: 240px; }
  .ad-infeed { grid-column: 1 / -1; border-style: dashed; }
  .ad-infeed .ad-canvas { min-height: 130px; }
  @media (max-width: 720px) {
    .ad-leaderboard .ad-canvas { min-height: 80px; }
    .ad-disclosure-meta { display: none; }
  }

  /* ── affiliate ──────────────────────────────────────────────────────────── */
  .affiliate-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-top: 24px;
  }
  @media (max-width: 1100px) { .affiliate-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .affiliate-grid { grid-template-columns: 1fr; } }
  .affiliate-card {
    display: flex;
    flex-direction: column;
    background: var(--surface-1);
    border: 0.5px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    text-decoration: none;
    color: inherit;
    transition: all 0.18s ease;
  }
  .affiliate-card:hover {
    border-color: color-mix(in oklab, var(--accent) 50%, var(--line-strong));

    box-shadow: 0 12px 32px -16px rgba(0,0,0,0.45);
  }

  .affiliate-body h4 {
    font-family: 'Fraunces', serif; font-weight: 500;
    font-size: 17px; margin: 2px 0 4px;
    line-height: 1.2; letter-spacing: -0.005em;
  }
  .affiliate-body p {
    font-size: 13px; color: var(--ink-2);
    line-height: 1.45; margin: 0;
  }
  .affiliate-foot {

  .affiliate-price-wrap {
    display: inline-flex; align-items: baseline; gap: 8px;

  .affiliate-price { font-weight: 700; color: var(--ink-1); font-size: 17px; letter-spacing: -0.01em; }
  .affiliate-price-old {
    font-size: 12px; color: var(--ink-3);

  }
  .affiliate-cta {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--accent); font-weight: 600;
    padding: 6px 11px;
    border: 0.5px solid color-mix(in oklab, var(--accent) 50%, transparent);
    border-radius: 999px;
    background: color-mix(in oklab, var(--accent) 8%, transparent);
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .affiliate-card:hover .affiliate-cta {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* affiliate extras */
  .affiliate-meta {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.06em;

  .affiliate-thumb { position: relative; }
  .affiliate-thumb-dup-anchor { display: none; }
  .affiliate-badge {
    position: absolute; top: 8px; left: 8px;

  .affiliate-badge-fresh { background: oklch(0.50 0.12 140); color: #fff; }
  .affiliate-badge-favorite { background: oklch(0.55 0.13 50); color: #fff; }
  .affiliate-cat {

  }
  .affiliate-rating-num { font-size: 12px; font-weight: 600; color: var(--ink-1); }

  .affiliate-disclaimer {
    margin-top: 28px;
    padding: 14px 18px;
    border-top: 0.5px solid var(--line);

    color: var(--ink-3);
    line-height: 1.5;
    font-style: italic;

  /* ── chill zone ─────────────────────────────────────────────────────────── */
  .chill-section {
    margin-top: 16px;
    padding: 80px 0;
    background: var(--espresso);
    color: #f3ece1;
    position: relative;
    overflow: hidden;
  }
  .chill-section::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 0%, color-mix(in oklab, var(--accent) 35%, transparent) 0%, transparent 45%),
      radial-gradient(circle at 80% 100%, color-mix(in oklab, var(--accent) 22%, transparent) 0%, transparent 50%);

  .yt-channel-name {

  .playing-bars i:nth-child(1) { animation-delay: 0s; height: 60%; }

  @keyframes bars {

  /* ── mini player ────────────────────────────────────────────────────────── */
  .mini-player {
    position: fixed;
    left: 24px; bottom: 24px;

  .mini-title {

  /* near-me */

  /* newsletter */
  .newsletter-section {
    margin-top: 8px;
    padding: 64px 0;

    color: var(--ink-3);

<body>
<div class="site-bg" aria-hidden="true">
  <video class="site-bg-video" autoplay muted loop playsinline preload="auto">
    <source src="assets/coffee-pour.mp4" type="video/mp4" />
  </video>
  <div class="site-bg-tint"></div>
  <div class="site-bg-grain"></div>
  <div class="site-bg-mask"></div>
</div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="blog-data.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="blog-sections.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "orange",
  "showMiniPlayer": true,
  "showAdSlots": true,
  "density": "compact"
}/*EDITMODE-END*/;

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [lang, setLang] = useState("es");
  const [query, setQuery] = useState("");
  const [playing, setPlaying] = useState(false);
  const [currentTrack, setCurrentTrack] = useState(0);
  const [miniDismissed, setMiniDismissed] = useState(false);
  const [geo, setGeo] = useState(null);
  const [geoState, setGeoState] = useState("idle");

  // view: "home" | "blog" | "article"; articleSlug only relevant when "article"
  const [view, setView] = useState("home");
  const [articleSlug, setArticleSlug] = useState(null);

  const t = I18N[lang];

  const localRef = useRef(null);
  const aboutRef = useRef(null);
  const spainRef = useRef(null);
  const directoryRef = useRef(null);
  const youtubeRef = useRef(null);
  const blogRef = useRef(null);

  useEffect(() => {
    document.documentElement.lang = lang;
    document.title = lang === "es"
      ? "Cash Café — Guía global de cafeterías"
      : "Cash Café — A global coffee guide";
  }, [lang]);

  const onNav = (where) => {
    if (where === "home") {
      setView("home");
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (where === "blog") {
      setView("blog");
      window.scrollTo({ top: 0, behavior: "instant" });
      return;
    }
    if (where === "legal" || where === "privacy" || where === "cookies") {
      setView("legal");
      window.scrollTo({ top: 0, behavior: "instant" });
      return;
    }
    if (view !== "home") {
      setView("home");
      // wait one tick for the home tree to mount before scrolling
      setTimeout(() => onNav(where), 50);
      return;
    }
    const target = {
      directory: directoryRef,
      local: localRef,
      about: aboutRef,
      spain: spainRef,
      youtube: youtubeRef,
    }[where];
    if (target?.current) {
      window.scrollTo({
        top: target.current.getBoundingClientRect().top + window.scrollY - 70,
        behavior: "smooth",
      });
    }
  };

  const onOpenArticle = (slug) => {
    setArticleSlug(slug);
    setView("article");
  };
  const onBackToBlog = () => {
    setView("blog");
    setArticleSlug(null);
  };

  const onSearch = (q) => {
    setQuery(q);
    if (view !== "home") setView("home");
    setTimeout(() => {
      if (directoryRef.current) {
        window.scrollTo({
          top: directoryRef.current.getBoundingClientRect().top + window.scrollY - 70,
          behavior: "smooth",
        });
      }
    }, 50);
  };

  return (
    <div className={`accent-${tw.accent}`}>
      <TopBar t={t} lang={lang} setLang={setLang} onNav={onNav} view={view}/>

      {view === "home" && (
        <React.Fragment>
          <Hero t={t} lang={lang} query={query} setQuery={setQuery}
                onSearch={onSearch} onNavLocal={() => onNav("local")}/>

          <FeaturedLocal t={t} lang={lang} cafe={LOCAL_CAFE} sectionRef={localRef}/>

          <AboutUs t={t} lang={lang} sectionRef={aboutRef}/>

          <SpainFocus t={t} lang={lang} sectionRef={spainRef} density={tw.density}/>

          <NearMeBar t={t} lang={lang} geo={geo} setGeo={setGeo} geoState={geoState} setGeoState={setGeoState}/>

          {tw.showAdSlots && (
            <div className="container" style={{ marginBottom: 32, marginTop: 32 }}>
              <AdSlot t={t} lang={lang} variant="leaderboard"/>
            </div>
          )}

          <Directory t={t} lang={lang} query={query} setQuery={setQuery}
                     sectionRef={directoryRef} density={tw.density} geo={geo}/>

          <SponsorStrip t={t} lang={lang}/>

          <AffiliateRow t={t} lang={lang}/>

          <Newsletter t={t} lang={lang}/>

          <YouTubeSection t={t} lang={lang} sectionRef={youtubeRef}/>
        </React.Fragment>
      )}

      {view === "blog" && (
        <BlogIndex t={t} lang={lang} sectionRef={blogRef} onOpen={onOpenArticle}/>
      )}

      {view === "article" && articleSlug && (
        <BlogArticle slug={articleSlug} t={t} lang={lang}
                     onBack={onBackToBlog} onOpen={onOpenArticle}/>
      )}

      {view === "legal" && (
        <LegalPage t={t} lang={lang} onNav={onNav}/>
      )}

      <Footer t={t} lang={lang} onNav={onNav}/>
      <CookieBanner lang={lang}/>

      <TweaksPanel title="Tweaks">
        <TweakSection label={lang === "es" ? "Apariencia" : "Appearance"}/>
        <TweakRadio
          label={lang === "es" ? "Acento" : "Accent"}
          value={tw.accent}
          options={["orange", "brass", "terracotta", "forest"]}
          onChange={(v) => setTweak("accent", v)}
        />
        <TweakRadio
          label={lang === "es" ? "Densidad" : "Density"}
          value={tw.density}
          options={["compact", "regular"]}
          onChange={(v) => setTweak("density", v)}
        />
        <TweakSection label={lang === "es" ? "Monetización" : "Monetization"}/>
        <TweakToggle
          label={lang === "es" ? "Banners AdSense" : "AdSense banners"}
          value={tw.showAdSlots}
          onChange={(v) => setTweak("showAdSlots", v)}
        />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
