<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cash Café</title>
<script>
  // GitHub Pages SPA routing: redirect /blog/slug → /?p=/blog/slug
  // index.html reads ?p= and restores the correct view
  var path = window.location.pathname;
  if (path && path !== '/') {
    window.location.replace('/?p=' + path);
  } else {
    window.location.replace('/');
  }
</script>
</head>
<body></body>
</html>
