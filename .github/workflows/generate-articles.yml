name: Generate SEO Articles

on:
  schedule:
    - cron: '10 10 * * *'  # 12:10 Spain
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of articles to generate'
        required: false
        default: '3'
        type: choice
        options: ['1', '2', '3', '5', '6', '10']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Anti-pattern random delay
        run: |
          DELAY=$((RANDOM % 1500))
          echo "::notice::Anti-pattern delay: ${DELAY}s"
          sleep $DELAY

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Determine article count
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "count=${{ github.event.inputs.count }}" >> $GITHUB_OUTPUT
          else
            echo "count=3" >> $GITHUB_OUTPUT
          fi

      - name: Generate articles
        id: generate
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AMAZON_TAG: vds96-20
          SITE_URL: https://cash-cafe.org
          BRAND: CashCafe
        run: |
          SUCCESS=0
          FAILED=0
          for i in $(seq 1 ${{ steps.config.outputs.count }}); do
            echo "--- Generating article $i of ${{ steps.config.outputs.count }} ---"
            if ARTICLE_INDEX=$i python scripts/generate_article.py; then
              SUCCESS=$((SUCCESS + 1))
            else
              echo "Attempt 1 failed, retrying in 120s..."
              sleep 120
              if ARTICLE_INDEX=$i python scripts/generate_article.py; then
                SUCCESS=$((SUCCESS + 1))
              else
                echo "Attempt 2 failed, retrying in 120s..."
                sleep 120
                if ARTICLE_INDEX=$i python scripts/generate_article.py; then
                  SUCCESS=$((SUCCESS + 1))
                else
                  FAILED=$((FAILED + 1))
                  echo "Article $i failed after 3 attempts"
                fi
              fi
            fi
            if [ $i -lt ${{ steps.config.outputs.count }} ]; then
              sleep 60
            fi
          done
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "=== Result: $SUCCESS OK, $FAILED failed ==="

      - name: Check something was generated
        # Without this gate the job ends GREEN with 0 articles: cash-cafe.org
        # spent a month "succeeding" while publishing nothing.
        run: |
          if [ "${{ steps.generate.outputs.success }}" = "0" ]; then
            echo "::error::0 of ${{ steps.config.outputs.count }} articles — all three AI providers failed"
            exit 1
          fi

      - name: Build check
        id: build
        run: |
          npm run build
          echo "Build OK"

      - name: Commit and push
        if: success()
        run: |
          git config user.name "CashCafe Bot"
          git config user.email "vladys.z96@gmail.com"
          git add src/content/blog/
          if git diff --staged --quiet; then
            echo "No new articles to commit"
          else
            ARTICLE_COUNT=$(git diff --staged --name-only | wc -l | tr -d ' ')
            git commit -m "articulo: auto-generated $(date +%Y-%m-%d) ($ARTICLE_COUNT new)"
            git push
          fi

      - name: Telegram summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SUCCESS="${{ steps.generate.outputs.success }}"
          FAILED="${{ steps.generate.outputs.failed }}"
          TOTAL="${{ steps.config.outputs.count }}"
          STATUS="${{ job.status }}"

          if [ "$STATUS" = "success" ] && [ "${FAILED:-0}" = "0" ]; then
            EMOJI=""
            MSG="<b>CashCafe</b> — $SUCCESS/$TOTAL articulos generados"
          elif [ "${SUCCESS:-0}" != "0" ]; then
            EMOJI=""
            MSG="<b>CashCafe</b> — $SUCCESS/$TOTAL OK, $FAILED fallidos"
          else
            EMOJI=""
            MSG="<b>CashCafe</b> — FALLO ($STATUS)"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="$MSG" || true

      - name: Fix and retry on build failure
        if: failure() && steps.build.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Build failed. Reverting problem articles..."
          for f in $(git diff --name-only -- src/content/blog/); do
            git checkout -- "$f" 2>/dev/null && echo "Reverted: $f"
          done
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="<b>CashCafe</b> — Build fallo, articulos revertidos" || true
